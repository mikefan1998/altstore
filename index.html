<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>安装 ActivityShop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    .icon {
      width: 88px;
      height: 88px;
      background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
      border-radius: 22px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 36px;
      font-weight: 700;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #86868b; font-size: 15px; margin-bottom: 28px; }
    .btn {
      display: block;
      width: 100%;
      background: #007AFF;
      color: white;
      padding: 16px 0;
      border-radius: 14px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn-secondary {
      background: #e5e5ea;
      color: #1d1d1f;
    }
    .tip {
      color: #86868b;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 20px;
    }
    .source-url {
      background: #f2f2f7;
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      word-break: break-all;
      color: #555;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">A</div>
    <h1>ActivityShop</h1>
    <p class="subtitle">通过 AltStore 安装</p>

    <a class="btn" href="altstore://source?url=https://raw.githubusercontent.com/mikefan1998/altstore/main/activityshop-source.json">
      添加到 AltStore
    </a>

    <a class="btn btn-secondary" href="https://github.com/mikefan1998/altstore/releases/tag/v1.05.06">
      查看 Release
    </a>

    <p class="tip">
      点击按钮后会调起 AltStore 并自动添加 Source。<br>
      如果设备上未安装 AltStore，请先安装。
    </p>

    <div class="source-url">
      Source: https://raw.githubusercontent.com/mikefan1998/altstore/main/activityshop-source.json
    </div>
  </div>
</body>
</html>
